# Fejlesztői / futtató környezet konténerekben.
#
#  - Csak az adatbázis (fejlesztéshez):   docker compose up -d db
#  - Teljes stack (API + adatbázis):      docker compose up --build
#
# Az API a "db" hoston éri el a PostgreSQL-t (a compose belső hálózatán).
services:
  db:
    image: postgres:17
    container_name: healthtracker-db
    environment:
      POSTGRES_DB: healthtracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthtracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/HealthTracker.Api/Dockerfile
    container_name: healthtracker-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=healthtracker;Username=postgres;Password=postgres"
      # Ha a React frontendet is konténerbe teszed, ide kerül majd annak a címe.
      Cors__AllowedOrigin: "http://localhost:4200"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
