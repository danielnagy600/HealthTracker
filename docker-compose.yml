# Fejlesztői / futtató környezet konténerekben.
#
#  - Csak az adatbázis (fejlesztéshez):        docker compose up -d db
#  - Teljes stack (frontend + API + adatbázis): docker compose up --build
#
# Az API a "db" hoston éri el a PostgreSQL-t, a böngésző pedig a hoston publikált
# portokon (localhost:4200 / localhost:8080) éri el a frontendet és az API-t.
services:
  db:
    image: postgres:17
    container_name: healthtracker-db
    environment:
      POSTGRES_DB: healthtracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d healthtracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/HealthTracker.Api/Dockerfile
    container_name: healthtracker-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=healthtracker;Username=postgres;Password=postgres"
      # A frontend konténer publikált (host) címe - ide fut be a böngészőből a CORS preflight.
      Cors__AllowedOrigin: "http://localhost:4200"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # A böngészőből, a hostról hívjuk az API-t, ezért a host oldali (nem a
        # compose-belső) API-cím kell ide - ez egyezik az api service publikált portjával.
        VITE_API_BASE: http://localhost:8080
    container_name: healthtracker-frontend
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  pgdata:
