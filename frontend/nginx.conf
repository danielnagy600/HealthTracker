# A React Router (BrowserRouter) kliensoldali útvonalakat használ, ezért minden
# ismeretlen elérési utat vissza kell adni az index.html-nek – különben egy
# oldalfrissítés pl. a /schedule útvonalon 404-et adna.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
